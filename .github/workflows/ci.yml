name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-fund
      - name: Run tests
        working-directory: frontend
        run: npm test
      - name: Build production assets
        working-directory: frontend
        run: npm run build

  backend:
    name: Backend tests and verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify backend
        working-directory: backend
        run: mvn -B -ntp verify

  support-sandbox:
    name: Support sandbox regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run sandbox regression tests
        working-directory: support-learning-sandbox
        run: python -m unittest -v
      - name: Check Python syntax and regression JSON
        working-directory: support-learning-sandbox
        run: |
          python -m py_compile conversation_quality.py test_conversation_quality.py
          python -m json.tool conversation_regression_cases.json > /dev/null

  ai-gateway:
    name: AI Gateway tests, watchdog self-check & stress benchmark
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis/redis-stack-server:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-gateway/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic jieba pymysql httpx "redis>=5.0" trafilatura pytest pytest-asyncio

      - name: "Run Pytest test suite (153 tests: Hybrid RAG, Semantic Cache, Chaos & Hardening)"
        env:
          LLM_BACKEND: mock
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          GATEWAY_API_KEY: lanlink-local-ai-gateway
          GATEWAY_RATE_LIMIT_PER_MIN: "100000"
          GATEWAY_RATE_LIMIT_BURST: "100000"
          GATEWAY_DISABLE_RATE_LIMIT: "1"
        run: |
          python -m pytest ai-gateway/tests -v

      - name: Run SRE Watchdog CI probe & state-machine self-test
        run: |
          python scripts/daemon_health_watchdog.py --mock-ci-test

      - name: Run High-concurrency Stress Benchmark (In-Process ASGI)
        env:
          LLM_BACKEND: mock
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          GATEWAY_DISABLE_RATE_LIMIT: "1"
        run: |
          python scripts/stress_benchmark.py --mode in-process --scale quick --report reports/stress_benchmark_report.md

      - name: Upload Stress Benchmark Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stress-benchmark-report
          path: reports/stress_benchmark_report.md
