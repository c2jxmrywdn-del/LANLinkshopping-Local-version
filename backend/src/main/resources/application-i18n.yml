# ============================================================
# 语言自动识别的服务端地理提示（app.i18n.geo.*）
#
# 作用：前端在「离线信号（时区/浏览器语言）不够明确」时，调用 /api/i18n/locale-hint，
# 由服务端根据客户端 IP 归属地给出国家/地区级提示，前端再纳入加权投票。
#
# 隐私最小化设计：
#  - 只取国家/地区码用于语言判定，不落库、不记录明文 IP；
#  - 结果按 IP 在内存中缓存（含 TTL），同一 IP 不会反复外发；
#  - 仅在离线信号不明确时才会被调用（高置信场景前端直接跳过请求）；
#  - 需要彻底关闭时设 I18N_GEO_ENABLED=false，识别将仅依赖离线信号。
# ============================================================
app:
  i18n:
    geo:
      enabled: ${I18N_GEO_ENABLED:true}
      # 支持 {ip} 占位符；响应体需含 country_code / countryCode / country 之一
      endpoint: ${I18N_GEO_ENDPOINT:https://ipapi.co/{ip}/json/}
      timeout-ms: ${I18N_GEO_TIMEOUT_MS:900}
