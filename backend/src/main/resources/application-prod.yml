server:
  port: ${PORT:8080}
  servlet:
    context-path: /api
    session:
      cookie:
        secure: ${SESSION_COOKIE_SECURE:false}
        http-only: true
        same-site: ${SESSION_COOKIE_SAMESITE:lax}

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
      validation-timeout: 5000

  jpa:
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  sql:
    init:
      mode: never

# Production defaults are fail-closed, with configurable env overrides
lanlink:
  payment:
    mock: ${LANLINK_PAYMENT_MOCK:false}
  verify-code:
    demo-mode: ${LANLINK_VERIFY_CODE_DEMO_MODE:false}
  demo-data:
    enabled: ${LANLINK_DEMO_DATA_ENABLED:false}

# Server-only proxy secret. A blank or missing secret fails closed.
support:
  proxy-secret: ${SUPPORT_PROXY_SECRET:}
