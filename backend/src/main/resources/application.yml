server:
  port: 8080
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      force: true
      enabled: true
    # 本地运行模式：同源（Vite 代理）+ HTTP，Session Cookie 放开 secure/same-site 限制
    session:
      cookie:
        http-only: true
        secure: false
        same-site: lax

spring:
  profiles:
    default: dev
  task:
    scheduling:
      # 本地知识库 outbox、商品索引、资讯抓取等定时任务并行，避免默认 1 线程互相饿死。
      pool:
        size: ${SPRING_TASK_SCHEDULING_POOL_SIZE:4}
  config:
    import: optional:classpath:application-payment.yml,optional:classpath:application-social.yml,optional:classpath:application-i18n.yml
  application:
    name: lanlink-shopping
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  servlet:
    multipart:
      # 全局上限 25MB/26MB：覆盖聊天媒体最大档（文件 20MB + multipart 开销），
      # 同时修复既有入驻材料 APPLY_MAX_SIZE=10MB 被旧全局 5MB/6MB 截断的隐患。
      max-file-size: 25MB
      max-request-size: 26MB
  # Redis 缓存连接：docker-compose 注入 REDIS_HOST=redis 走容器网络；
  # 本机直连时默认 localhost:6379。密码来自环境变量，仓库不落任何明文默认值。
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 0
  # 缓存后端类型：redis（默认，配合上方连接）；无 Redis 环境可设 LANLINK_CACHE_TYPE=simple 回退内存缓存。
  cache:
    type: ${LANLINK_CACHE_TYPE:redis}
  # 数据库版本化迁移（out/market-readiness-plan.md P0-5）：纳管 classpath:db-migrations。
  # baseline-version 取 2026.9.1：必须【低于】所有存量迁移脚本，否则 Flyway 按数字逐段比较会把
  # 它们判为 Below Baseline 静默跳过（历史值 2026.11.1 使 V2026_11=2026.11 永不执行，
  # 而代码已只读 t_campaign，旧 t_activity 数据不可见）。取 2026.9.1 后：
  #   - V2026_10 / V2026_11 均高于基线，非空库升级时会正常执行（脚本自身幂等）；
  #   - 后续 V2026_12+ 仍高于基线，不会被跳过。
  # baseline 尚未对账（拍板⑦-14 未完成，见下），启用前约束：
  #   1) baseline-on-migrate 只在【非空库】生效（Flyway 11.7.2 源码：空库跳过 baseline 并全量执行迁移），
  #      而 V2026_10/V2026_11 是依赖 schema.sql 先建表的存量数据迁移，且 Boot 3.5.3 中 Flyway 先于
  #      spring.sql.init 脚本执行 —— 全新空库首启会因 t_member_card 不存在而失败；
  #      新克隆首次启动请先 SPRING_FLYWAY_ENABLED=false 让 schema.sql 建表，第二次启动再恢复。
  #   2) 两个既有 SQL 是否已在生产库手工执行未核实，baseline 前必须对账（拍板⑦-14），未对账前 prod 强制 enabled=false。
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db-migrations
    baseline-on-migrate: true
    baseline-version: "2026.9.1"
  # 邮箱验证码：本地运行模式默认指向 Mailpit（localhost:1025）。
  # 需要真实 QQ 邮箱 SMTP 时：MAIL_HOST=smtp.qq.com / MAIL_PORT=465 / MAIL_SMTP_SSL=true 并填授权码。
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    protocol: smtp
    username: ${MAIL_USERNAME:lanlink@local.dev}
    password: ${MAIL_PASSWORD:lanlink-local}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: false
          ssl:
            enable: ${MAIL_SMTP_SSL:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
            required: ${MAIL_SMTP_STARTTLS_REQUIRED:false}
          # 超时机制：连接/读取/写入均 10 秒，避免 SMTP 无响应拖垮接口
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
  # RabbitMQ 消息队列（out/storage-mq-plan.md 任务 B2）：订单支付流
  #   （OrderPaidEvent AFTER_COMMIT 桥接发布，生产端 publisher-confirm；业务异常上抛
  #   → spring-retry 3 次 1s/2s/4s → 耗尽不回队列（default-requeue-rejected=false）
  #   → 经 lanlink.dlx 进 q.order.paid.dlq 死信队列）。
  #   消费通道开关见 app.mq.order-flow（mq/event 互斥，RabbitConfig/监听器侧条件化）。
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    # 三节点集群地址；设置后 host/port 仅作为单机回退占位
    addresses: ${RABBITMQ_ADDRESSES:${RABBITMQ_HOST:localhost}:${RABBITMQ_PORT:5672}}
    username: ${RABBITMQ_USER:}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: /
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 10
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000
          multiplier: 2.0

# 只公开健康状态，不公开组件详情、数据库地址或凭据。
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  health:
    # SMTP 不是应用存活探针的一部分；出站 SMTP 超时不能拖慢健康检查。
    mail:
      enabled: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 对象存储（out/storage-mq-plan.md 任务 A2 + security-hardening-plan.md P1-1）：库内一律存 object key
# （如 products/1001.webp），出站由 StorageUrlSerializer/StorageUrls 统一拼公开绝对 URL；
# enabled=false 全链路回退现状（上传落本地盘 /api/uploads/**，出站原样）。
# 前缀统一 lanlink.storage：env LANLINK_STORAGE_ENABLED 经宽松绑定直达开关（旧 app.storage 前缀绑不上）。
# 凭据兜底为空串——缺失或出厂弱默认值在 StorageConfig 创建 S3Client 前 fail-fast，禁止静默用弱凭据启动。
# MinIO 必须 forcePathStyle(true)（StorageConfig Bean 侧读取）；切腾讯 COS/阿里 OSS 仅改 env。
lanlink:
  # 字段加密（com.lanlink.shopping.crypto）：新写入一律 JWE compact（RSA-OAEP-256 + A256GCM，header 带 kid），
  # 历史密文仍是 legacy AES-256-GCM，按密文形态双读兼容（无 DDL）。
  # 注意：这里刻意不写 crypto.secret —— 一旦写成 `${LANLINK_CRYPTO_SECRET:}`，
  # 缺省空串会把真实环境变量覆盖掉；legacy 主密钥只从环境变量 LANLINK_CRYPTO_SECRET 注入。
  crypto:
    min-rsa-bits: ${LANLINK_CRYPTO_MIN_RSA_BITS:2048}
    jwe:
      # 关闭后只写 legacy 格式（仅过渡期排障用，不建议长期开启）
      enabled: ${LANLINK_CRYPTO_JWE_ENABLED:true}
      # true = 密钥缺失直接启动失败，避免生产静默降级写回 AES-GCM
      required: ${LANLINK_CRYPTO_JWE_REQUIRED:false}
      # 明文为 PKCS#8 / X509 DER 的 Base64（允许带 PEM 头尾与换行，服务端会清理）
      active-kid: ${LANLINK_CRYPTO_JWE_ACTIVE_KID:}
      active-private-key: ${LANLINK_CRYPTO_JWE_ACTIVE_PRIVATE_KEY:}
      active-public-key: ${LANLINK_CRYPTO_JWE_ACTIVE_PUBLIC_KEY:}
      # 轮换期旧私钥：只用于解密，让历史 JWE 在新密钥上线后仍可读
      previous-kid: ${LANLINK_CRYPTO_JWE_PREVIOUS_KID:}
      previous-private-key: ${LANLINK_CRYPTO_JWE_PREVIOUS_PRIVATE_KEY:}
  storage:
    enabled: ${LANLINK_STORAGE_ENABLED:true}
    endpoint: ${LANLINK_S3_ENDPOINT:http://localhost:9000}
    region: ${LANLINK_S3_REGION:us-east-1}
    access-key: ${LANLINK_S3_ACCESS_KEY:}
    secret-key: ${LANLINK_S3_SECRET_KEY:}
    bucket: ${LANLINK_S3_BUCKET:products}
    path-style: ${LANLINK_S3_PATH_STYLE:true}
    public-base-url: ${LANLINK_S3_PUBLIC_BASE_URL:http://localhost:9000/products}
    # 客服多模态私有桶与浏览器直传预签名（P0 存储基座）：桶与商品桶隔离，
    # 预签名 action = 请求 Origin + /support-media（nginx 同源反代到 MinIO，path-style）。
    support-bucket: ${LANLINK_S3_SUPPORT_BUCKET:support-media}
    presign-origins: ${LANLINK_S3_PRESIGN_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
    presign-ttl-seconds: ${LANLINK_S3_PRESIGN_TTL_SECONDS:600}
  # 邀请链接（专属邀请码 → 注册页）
  # register-url 指向【前端 SPA 注册页】而不是 API：二维码被扫后应直接落到注册表单，
  # 生产部署时用 LANLINK_INVITE_REGISTER_URL 覆盖成正式域名（如 https://lanlink.cc.cd/register）。
  # expires-days<=0 表示永不过期；默认 30 天，与「支持有效期配置」的要求对应。
  # max-uses 是邀约码默认可使用次数，0=不限；生产按运营策略用 LANLINK_INVITE_MAX_USES 覆盖。
  # merchant-apply-url 指向【前端商户入驻表单】/merchant（旧 /merchant-apply 由前端路由 alias 兼容），
  # 生产部署时用 LANLINK_INVITE_MERCHANT_APPLY_URL 覆盖成正式域名（如 https://lanlink.cc.cd/merchant）。
  invite:
    expires-days: ${LANLINK_INVITE_EXPIRES_DAYS:30}
    max-uses: ${LANLINK_INVITE_MAX_USES:0}
    register-url: ${LANLINK_INVITE_REGISTER_URL:http://localhost:5173/register}
    merchant-apply-url: ${LANLINK_INVITE_MERCHANT_APPLY_URL:http://localhost:5173/merchant}

# 消息队列消费通道开关（out/storage-mq-plan.md B4）：mq=走 RabbitMQ（默认），event=回退 Spring 事件。
# 必须用占位符显式桥接：Boot 宽松绑定对带连字符属性走去连字符形式（APP_MQ_ORDERFLOW），
# LANLINK_MQ_ORDER_FLOW 无法直连 app.mq.order-flow；RabbitConfig/监听器 @ConditionalOnProperty 读此键。
app:
  # 超时未支付订单自动关闭（OrderTimeoutCloser）：扫表式，1 分钟一轮、每轮 50 单。
  # 账期单（pay_type=term）不参与；关单与支付由两条互斥的条件更新裁决，多实例下只有一方成功。
  order:
    auto-close-enabled: ${LANLINK_ORDER_AUTOCLOSE_ENABLED:true}
    auto-close-timeout-minutes: ${LANLINK_ORDER_AUTOCLOSE_MINUTES:30}
    auto-close-interval-ms: ${LANLINK_ORDER_AUTOCLOSE_INTERVAL_MS:60000}
    auto-close-initial-delay-ms: ${LANLINK_ORDER_AUTOCLOSE_INITIAL_MS:30000}
  # P1-5 运费报价（FreightQuoteService）：总开关默认 false = 全站运费恒 0，
  # 与“运费未接入”的上线前行为完全一致（防默认模板 id=1 给全站每单凭空加运费，典型历史模板首价 ¥12）。
  # 启用顺序：先在 t_logistics_template 配好可用默认模板 → 验证 quote 金额 → 再置 enabled=true → 灰度。
  # 详见 reports/impl/freight-enabled-switch.md
  freight:
    enabled: ${APP_FREIGHT_ENABLED:false}
    default-template-id: ${APP_FREIGHT_DEFAULT_TEMPLATE_ID:1}
  mq:
    order-flow: ${LANLINK_MQ_ORDER_FLOW:mq}
    # notify-flow 只切系统通知侧（NotifyRabbitConfig/Enqueuer/Publisher/Worker/Consumer 与
    # TechSideEffectListener 互斥）；订单侧走 order-flow，两条链路的交换机与死信互不借用。
    notify-flow: ${LANLINK_MQ_NOTIFY_FLOW:mq}
    # attachment-flow 切附件缩略图链路（AttachmentRabbitConfig/Publisher/Consumer/Sweeper 一起条件化）。
    # 关掉后上传照旧成功，只是不再有预览：thumb_status 停在 PENDING，重新打开由补投扫描接手。
    attachment-flow: ${LANLINK_MQ_ATTACHMENT_FLOW:mq}
    # 消费并发（min-max）：削峰演示靠它把"单消费者积压"和"多消费者排空"跑出可对比的数字
    attachment-consumer-concurrency: ${LANLINK_MQ_ATTACHMENT_CONCURRENCY:1-3}
    attachment-sweep-interval-ms: ${LANLINK_MQ_ATTACHMENT_SWEEP_MS:120000}
    attachment-sweep-initial-delay-ms: ${LANLINK_MQ_ATTACHMENT_SWEEP_INITIAL_MS:45000}
    # support-media-flow 切客服多模态解析链路（RabbitConfig + OutboxWorker 一起条件化）；
    # 关掉后上传/确认照旧成功，outbox 停在待投递，重新打开由 worker 与对账任务接手。
    support-media-flow: ${LANLINK_MQ_SUPPORT_MEDIA_FLOW:mq}
  # 商户退店（P2）：公示期法定 30 天；时间闸门默认 0（关闭）；保证金为账面登记不接真实打款
  merchant-exit:
    notice-days: ${LANLINK_MERCHANT_EXIT_NOTICE_DAYS:30}
    min-complete-days: ${LANLINK_MERCHANT_EXIT_MIN_COMPLETE_DAYS:0}
    deposit-amount: ${LANLINK_MERCHANT_EXIT_DEPOSIT_AMOUNT:2000.00}
    poll-ms: ${LANLINK_MERCHANT_EXIT_POLL_MS:3600000}
  # 客服多模态媒体（P0 存储基座）：单文件上限按类型分档，配额三维度各自独立计数。
  # Redis 不可用时默认 fail-closed（拒绝新媒体上传），但绝不阻断文本客服主链路。
  support-media:
    retention-days: ${SUPPORT_MEDIA_RETENTION_DAYS:30}
    max-image-mb: ${SUPPORT_MEDIA_MAX_IMAGE_MB:10}
    max-audio-mb: ${SUPPORT_MEDIA_MAX_AUDIO_MB:10}
    max-video-mb: ${SUPPORT_MEDIA_MAX_VIDEO_MB:20}
    max-doc-mb: ${SUPPORT_MEDIA_MAX_DOC_MB:20}
    hourly-limit: ${SUPPORT_MEDIA_HOURLY_LIMIT:100}
    session-limit: ${SUPPORT_MEDIA_SESSION_LIMIT:60}
    message-limit: ${SUPPORT_MEDIA_MESSAGE_LIMIT:10}
    redis-fail-closed: ${SUPPORT_MEDIA_REDIS_FAIL_CLOSED:true}
    # P2 图像/文件理解扩容：扫描版 PDF 视觉兜底渲染页数（默认 3）
    pdf-scan-pages: ${SUPPORT_MEDIA_PDF_SCAN_PAGES:3}
  # 高德开放平台商业图源凭据：仅由后端持有，登录用户经 GET /logistics/map-config 下发；
  # 不再经 VITE_* 构建注入前端（历史机制会把 key/securityJsCode 明文打进 dist）。留空=前端回退内置矢量底图。
  map:
    amap:
      key: ${AMAP_KEY:}
      security-js-code: ${AMAP_SECURITY_JS_CODE:}

# 物流跟踪（out/logistics-tracking-plan.md P1，module/tracking）：渠道推送回调 + 定时补拉双通道，
# 补拉为主路径。红线 D6：真实渠道密钥一律环境变量注入（不入库不入仓），留空=对应通道
# configured()=false，自动退化为补拉兜底；provider.api_key 列不存真实密钥。
logistics:
  tracking:
    # 总开关（P4 灰度演练用：false 时 ship 主流程零影响）
    enabled: ${TRACKING_ENABLED:true}
    # 补拉巡检 cron：默认每 10 分钟（对齐 SLA watchdog 的 cron 调度写法，不引入 XXL-Job；
    # 多实例部署预留 ShedLock 注释位见 TrackingSyncWorker，多副本防重由任务行级 CAS 认领兜底）
    poll-cron: "0 */10 * * * ?"
    # 成功回调/成功补拉后顺延 next_poll_time 的间隔 ms
    poll-interval-ms: ${TRACKING_POLL_INTERVAL_MS:600000}
    # 补拉触发静默阈值（小时）：运单最后渠道事件超此时长仍未签收 → 兜底补拉
    poll-stale-hours: 4
    # 主通道连续失败 N 次切换备用通道（fail_count 热扩列累计 + 切换日志，P2 双通道路由）
    primary-fail-threshold: 3
    # 渠道主→备映射（key=主渠道编码 value=备用渠道编码，如 kuaidi100→kdniao；未配置的渠道不切换）
    fallback-routes: {}
    # 异常识别巡检 cron（48h 无更新 → EXCEPTION 告警 + 看板；对齐 SLA watchdog 写法）
    exception-cron: "0 */30 * * * ?"
    # 异常识别静默阈值（小时）
    exception-stale-hours: 48
    # 人工复核静默阈值（小时）：签收后超此时长无更新且 e-POD 未复核 → 人工复核队列
    review-stale-hours: 24
    # 监控指标统计窗口（小时，GET /api/admin/logistics/metrics）
    metrics-window-hours: 24
    # 回调审计日志保留天数（防表膨胀）
    callback-log-retention-days: 30
    # 回调 URL 路径段共享 token（Mock 共用）。无内置默认值：未配置即拒绝全部 URL-token 回调，
    # 避免 compose 漏注入 TRACKING_* 时静默退回可猜的 dev-callback-token（审计 P1-3）。
    # 生产/联调必须注入 >= 16 位随机串，建议 32 位 hex：
    #   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
    callback-url-token: ${TRACKING_CALLBACK_URL_TOKEN:}
    kuaidi100:
      key: ${TRACKING_KUAIDI100_KEY:}
      customer: ${TRACKING_KUAIDI100_CUSTOMER:}
      salt: ${TRACKING_KUAIDI100_SALT:}
      # 请求端签名算法：官方 signType=SHA256 优先，MD5 兜底（推送回调方向固定 MD5 不可升级）
      sign-type: ${TRACKING_KUAIDI100_SIGN_TYPE:SHA256}
