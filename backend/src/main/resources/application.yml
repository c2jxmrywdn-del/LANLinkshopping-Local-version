server:
  port: 8080
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      force: true
      enabled: true
    # 本地运行模式：同源（Vite 代理）+ HTTP，Session Cookie 放开 secure/same-site 限制
    session:
      cookie:
        http-only: true
        secure: false
        same-site: lax

spring:
  profiles:
    default: dev
  config:
    import: optional:classpath:application-payment.yml,optional:classpath:application-social.yml,optional:classpath:application-i18n.yml
  application:
    name: lanlink-shopping
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  servlet:
    multipart:
      # 全局上限 25MB/26MB：覆盖聊天媒体最大档（文件 20MB + multipart 开销），
      # 同时修复既有入驻材料 APPLY_MAX_SIZE=10MB 被旧全局 5MB/6MB 截断的隐患。
      max-file-size: 25MB
      max-request-size: 26MB
  # Redis 缓存连接：docker-compose 注入 REDIS_HOST=redis 走容器网络；
  # 本机直连时默认 localhost:6379。密码来自环境变量，仓库不落任何明文默认值。
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 0
  # 缓存后端类型：redis（默认，配合上方连接）；无 Redis 环境可设 LANLINK_CACHE_TYPE=simple 回退内存缓存。
  cache:
    type: ${LANLINK_CACHE_TYPE:redis}
  # 邮箱验证码：本地运行模式默认指向 Mailpit（localhost:1025）。
  # 需要真实 QQ 邮箱 SMTP 时：MAIL_HOST=smtp.qq.com / MAIL_PORT=465 / MAIL_SMTP_SSL=true 并填授权码。
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    protocol: smtp
    username: ${MAIL_USERNAME:lanlink@local.dev}
    password: ${MAIL_PASSWORD:lanlink-local}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: false
          ssl:
            enable: ${MAIL_SMTP_SSL:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
            required: ${MAIL_SMTP_STARTTLS_REQUIRED:false}
          # 超时机制：连接/读取/写入均 10 秒，避免 SMTP 无响应拖垮接口
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

# 只公开健康状态，不公开组件详情、数据库地址或凭据。
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  health:
    # SMTP 不是应用存活探针的一部分；出站 SMTP 超时不能拖慢健康检查。
    mail:
      enabled: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
