                    - paragraph [ref=e836]: IT之家 11 月 6 日消息，苹果 iPad mini（A20 Pro）今日正式开售，也就是大家俗称的“iPad mini 8”。新品起售价为 5499 元，国补后到手价约 4999 元。如果您可以使用教育优惠，国补后的到手价会进一步下探至 4599 元左右。 京东 Apple iPad mini (A20 Pro) 128GB5499 元直达链接 IT之家了解到，iPad mini（A20 Pro）提供午夜色、星光色两种配色。其机身相比上一代薄了 14%，轻了 13%。该机配备超视网膜 XDR 显示屏，采用 OLED 技术，峰值亮度可达 1,200 nits，支持 P3 广色域，对比度可达 2000000:1，不支持 ProMotion，256GB 和 512GB 机型可选配纳米纹理玻璃。 性能方面，iPad mini（A20 Pro）搭载 A20 Pro 芯片，其封装方式借鉴了 M 系列芯片。每个图形处理器核心均内置全新神经网络加速器，为 Apple 智能和各种 AI 任务加速。该平板 CPU 性能相比 iPad mini 7 提速至 1.6 倍，图形处理器性能提升至 2.7 倍。 需要注意的是，128GB 版和 256GB 版 iPad mini（A20 Pro）采用的 A20 Pro 芯片为 5 核 CPU（2 * 超级核心、3 * 能效核心）、7 核 GPU，以及 16 核 NPU；512GB 机型为 6 核 CPU（2 * 超级核心、4 * 能效核心）、7 核 GPU，以及双 16 核 NPU。 iPad mini（A20 Pro）采用 Apple N1 无线网络芯片，支持高速无线局域网、蓝牙 6 和 Thread 家庭网络技术。蜂窝网络机型采用 Apple C2 基带，支持 eSIM 。兼容 Apple Pencil Pro、Apple Pencil (USB‑C)，支持悬停功能。该平板具备 IP67 级防尘防水，在最深 1 米的水下停留时间最长可达 30 分钟。 IT之家附系列产品各版本定价如下： 128GB：Wi-Fi 版 5,499 元，Wi-Fi+ 蜂窝版 6,799 元 256GB：Wi-Fi 版 6,299 元，Wi-Fi+ 蜂窝版 7,599 元 512GB：Wi-Fi 版本 7,999 元，Wi-Fi+ 蜂窝版 9,299 元 京东
