                    - paragraph [ref=e827]: 市场不再相信存储超级周期？（中国证券报）2018年，存储行业经历了“超级周期”，但市场对此并不买账。存储行业分析师认为，存储超级周期的结束，意味着行业将进入一个相对稳定和成熟的发展阶段。然而，市场对存储行业的看法却与之相反。存储行业分析师认为，存储超级周期的结束，意味着行业将进入一个相对稳定和成熟的发展阶段。然而，市场对存储行业的看法却与之相反。
