                    - paragraph [ref=e836]: 据知情人士透露，OpenAI已完成约110亿美元的新融资，这是本轮估值1.25万亿美元融资的首笔部分。 资金已于周五划入公司账户。本轮剩余部分——总额可能增至最高200亿美元——预计将在未来数周内完成。 在推迟了首次公开募股（IPO）计划后，这家AI开发商已就一轮大额融资洽谈了一个多月。OpenAI最初计划以1.4万亿美元估值融资300亿美元或更多，随后在AI板块遭遇公开市场暴跌的背景下缩减了计划。 参与首笔交割的投资者包括Coatue Management和T. Rowe Price。本轮其他投资者包括软银集团、红杉资本、Founders Fund和Andreessen Horowitz。一个来自阿联酋的投资者财团也已加入。 OpenAI正与投行合作，向高净值个人和零售投资者募资。（华尔街见闻��
