                      - text: 首飞失利 9 个半月后，谷神星二号遥三运载火箭发射成功↗
                    - paragraph [ref=e854]: IT之家 11 月 7 日消息，今日 7 时 37 分，谷神星二号遥三运载火箭在酒泉卫星发射中心发射升空，将搭载的观澜试验星、云遥一号 28 星、中北大学一号卫星、钧天一号 06A 卫星共 4 颗卫星顺利送入预定轨道，飞行试验任务取得圆满成功。 这是谷神星二号在首飞失利后的复飞，距 2026 年 1 月 17 日遥一任务失败已过去约 9 个半月。 谷神星二号由星河动力研制，是在谷神星一号基础上放大升级的中型固体运载火箭。火箭采用三级固体串联加液体上面级构型，高约 30 米，箭体最大直径 2.35 米，起飞质量 100 吨，500 公里太阳同步轨道运载能力 1.3 吨。 谷神星一号的对应运力为 0.3 吨，谷神星二号将这一数字放大了约 3.3 倍，使星河动力进入吨级运力发射服务市场，面向中小型星座组网与大型星座补网需求。 相关阅读： 《谷神星二号民营商业运载火箭首次飞行试验任务失利》 《星河动力航天回应谷神星二号火箭首次飞行试验任务失利：全力查明故障原因》 《星河动力航天：谷神星二号（遥一）运载火箭飞行故障通过归零评审》
