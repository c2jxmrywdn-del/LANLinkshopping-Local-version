# ==============================================================================
# LANLink AI 网关生产环境 Nginx 反向代理配置模板
# 功能：SSL/TLS 终止、单 IP 防刷突发限流、大模型长推理超时、MCP SSE 流式长连接
# ==============================================================================

# 限流区域：每个 IP 限制平均 20 请求/秒，内存存储 10MB 状态
limit_req_zone $binary_remote_addr zone=ai_gateway_ip_limit:10m rate=20r/s;

server {
    listen 80;
    server_name ai.lanlink.com;
    # 强制跳转 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ai.lanlink.com;

    # SSL 证书配置（按实际路径替换）
    ssl_certificate /etc/nginx/ssl/ai.lanlink.com.crt;
    ssl_certificate_key /etc/nginx/ssl/ai.lanlink.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全头
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";

    # 单 IP 突发限制
    limit_req zone=ai_gateway_ip_limit burst=30 nodelay;

    # 1. OpenAPI 规范公开访问（供 Dify/Coze 免密拉取）
    location = /v1/ai/openapi.json {
        proxy_pass http://lanlink-ai-gateway:8090/v1/ai/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 2. 外部大模型与智能体集成端点（OpenAI Tools / 调度执行）
    location /v1/ai/ {
        proxy_pass http://lanlink-ai-gateway:8090/v1/ai/;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        # 必须关闭 proxy_buffering，支持实时流式返回
        proxy_buffering off;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # 外部客户端不得伪造限流绕过头
        proxy_set_header X-Bypass-Rate-Limit "";
    }

    # 3. Anthropic Model Context Protocol (MCP) 端点
    location /mcp {
        proxy_pass http://lanlink-ai-gateway:8090/mcp;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # 外部客户端不得伪造限流绕过头
        proxy_set_header X-Bypass-Rate-Limit "";
    }

    # 4. 健康探针
    location = /health {
        proxy_pass http://lanlink-ai-gateway:8090/health;
        access_log off;
    }
}
