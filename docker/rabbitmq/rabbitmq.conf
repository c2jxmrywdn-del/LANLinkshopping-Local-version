# RabbitMQ 4.1 同宿主三节点集群配置（挂载到每个节点的 /etc/rabbitmq/rabbitmq.conf）
# 注意：三节点必须共享同一 RABBITMQ_ERLANG_COOKIE，节点名必须唯一且可解析。
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq2
cluster_formation.classic_config.nodes.3 = rabbit@rabbitmq3

# 4.1 仍使用 Mnesia 元数据；少数派自动暂停，避免分区脑裂
cluster_partition_handling = pause_minority

# 新声明且未显式指定 x-queue-type 的队列默认使用 quorum；
# 死信队列在 Java 侧显式声明为 classic，以保留 basic.get 重放能力。
default_queue_type = quorum

# 资源水位（security-hardening-plan.md P1-4.5，防灌爆；容器 mem_limit=512m）：
# 容器内按宿主 RAM 算百分比会失效，必须用绝对值且 < mem_limit。
vm_memory_high_watermark.absolute = 320MB
# 默认 disk_free_limit 50MB 仅够开发；1GB 给 3 节点持久化 + DLQ 留余量
disk_free_limit.absolute = 1GB
# 单条消息上限：显式固化默认 16MiB，防止配置漂移后放大
max_message_size = 16777216
