# 注意：本文件不参与镜像构建。frontend/Dockerfile 只 COPY nginx.conf.template，
# 要改运行时 Nginx 行为请改那份，否则改动不会生效（两者已漂移过）。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml text/xml;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;

    # 上传闸门必须 >= spring.servlet.multipart.max-request-size（当前 26MB）。
    # nginx 默认 1m 会让它在后端之前先返回 413，后端 5/10/20MB 的分级上限全部形同虚设。
    client_max_body_size 26m;

    # 带 contenthash 的产物长缓存；与 nginx.conf.template 的 /assets/ 块保持一致
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 智能客服流式接口（SSE）：禁用代理缓冲与缓存，保持长连接与代理签名头透传
    location /api/support/ask-stream {
        # 代理响应由后端自行压缩，nginx 层关闭 gzip 避免二次压缩
        gzip off;
        proxy_pass http://backend:8080/api/support/ask-stream;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Support-Proxy-Secret "$http_x_support_proxy_secret";
        proxy_set_header X-Support-Client-IP $remote_addr;
    }

    location /api/support/ask {
        gzip off;
        proxy_pass http://backend:8080/api/support/ask;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Support-Proxy-Secret "$http_x_support_proxy_secret";
        proxy_set_header X-Support-Client-IP $remote_addr;
    }

    # 客服语音播报：与媒体接口同一套代理密钥注入。
    # 注意：本文件不参与镜像构建（frontend/Dockerfile 只 COPY nginx.conf.template），
    # 此段仅为保持与运行时配置一致，避免后续维护者按本文件排查时误判「缺失」。
    location /api/support/tts {
        gzip off;
        proxy_pass http://backend:8080/api/support/tts;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Support-Proxy-Secret "$http_x_support_proxy_secret";
        proxy_set_header X-Support-Client-IP $remote_addr;
    }

    # 客服实时语音（WebSocket 全双工）：必须显式做 Upgrade 升级 + 注入代理密钥。
    location /api/support/stream-voice {
        proxy_pass http://backend:8080/api/support/stream-voice;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Support-Proxy-Secret "$http_x_support_proxy_secret";
        proxy_set_header X-Support-Client-IP $remote_addr;
    }

    # 内部 AI 工具面不对浏览器暴露（与 nginx.conf.template 保持一致）。
    # 注意：本文件不参与镜像构建，实际生效的是 nginx.conf.template；
    # 此处同步是为了避免维护者按本文件排查时误判。
    location ^~ /api/internal/ {
        return 404;
    }

    location /api/ {
        gzip off;
        # backend 容器重建后容器 IP 会变：静态 proxy_pass 只在 nginx 启动时解析一次并永久缓存
        # 旧 IP，backend 重建后新 IP 连接被拒 → 全部 /api 502。127.0.0.11 是 Docker 内嵌 DNS，
        # valid=10s 让 IP 变更后 10 秒内自动重新解析。
        resolver 127.0.0.11 valid=10s ipv6=off;
        # 变量形式且不带 URI 部分 = 原样透传完整原始 URI（/api/... 直达后端 context-path=/api），
        # 与原 proxy_pass http://backend:8080/api/ 的路径语义完全一致（/api/auth/login 等）。
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 外部大模型与智能体集成端点（OpenAPI 规范 / OpenAI Tools / 统一调度）
    location /v1/ai/ {
        proxy_pass http://lanlink-ai-gateway:8090/v1/ai/;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 外部客户端不得伪造限流绕过头
        proxy_set_header X-Bypass-Rate-Limit "";
    }

    # Anthropic MCP 协议端点（Streamable HTTP / SSE / JSON-RPC 2.0）
    location /mcp {
        proxy_pass http://lanlink-ai-gateway:8090/mcp;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 外部客户端不得伪造限流绕过头
        proxy_set_header X-Bypass-Rate-Limit "";
    }

    # 后端指标只允许容器内 Prometheus 直连抓取，禁止经前端公网访问
    location = /api/actuator/prometheus {
        return 403;
    }

    # 商品图同源访问：前端静态回退图优先，未命中再回源本地 MinIO（匿名只读）
    location /products/ {
        try_files $uri @minio_products;
        add_header Cache-Control "public, max-age=86400";
    }

    location @minio_products {
        # 不带 URI 的 proxy_pass：原样透传 $request_uri，且无需 resolver 运行时解析
        proxy_pass http://minio:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 60s;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok\n';
    }
}
