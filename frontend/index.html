<!DOCTYPE html>
<html lang="zh-CN" class="notranslate" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 移动端适配器首屏标记：CSS 加载前确定 mobile/desktop，避免样式闪变 -->
    <script>
      (function () {
        try {
          var mq = window.matchMedia('(max-width: 767px)')
          document.documentElement.dataset.viewport = mq.matches ? 'mobile' : 'desktop'
        } catch (e) { /* 极旧浏览器忽略 */ }
      })()
    </script>
    <meta name="google" content="notranslate" />
    <meta name="robots" content="notranslate" />
    <!-- 站点图标：现代浏览器优先采用矢量 SVG（任意缩放清晰、体积更小）；
         保留 PNG 作为不支持 SVG favicon 的环境（旧 Safari/部分内嵌 WebView）的回退。 -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <!-- iOS 不支持 SVG apple-touch-icon，必须保留 PNG -->
    <link rel="apple-touch-icon" sizes="180x180" href="/logo-256.png" />
    <title>LANLinkshopping · 聚合型B2B电商平台</title>
    <!-- SEO 全局兜底 TDK（P1-19）：SPA 单份基线，按路由差异化注入（CSR/预渲染）随拍板⑦-12 后增强；
         此处仅写平台通用事实，不虚构具体商品/商户数据。 -->
    <meta name="description" content="LANLinkshopping 聚合型一体多元化解决方案 B2B 电商平台：面向工业大宗集采与供应链协同，覆盖商品商城、商户入驻、询价下单支付、企业钱包与账期、会员活动与物流履约的一站式采购体验。" />
    <meta name="keywords" content="B2B电商,工业品采购,大宗集采,供应链协同,商户入驻,企业账期,询价采购,批发平台,LANLinkshopping" />
    <meta name="robots" content="index,follow" />
    <!-- Open Graph 基线（P1-19）：og:url 与 og:image 为待生产域名确认的占位，
         og:type=website 是全局兜底；文章/商品级 og 随拍板⑦-12 的 TDK 注入方案增强。 -->
    <meta property="og:site_name" content="LANLinkshopping" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="LANLinkshopping · 聚合型B2B电商平台" />
    <meta property="og:description" content="面向工业大宗集采与供应链协同的 B2B 电商平台：商品商城、商户入驻、询价下单支付、企业钱包与账期、会员活动与物流履约一站式覆盖。" />
    <meta property="og:url" content="https://lanlink.cc.cd/" />
    <meta property="og:image" content="https://lanlink.cc.cd/logo-256.png" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:locale:alternate" content="en_US" />
    <!-- 首屏关键 logo 预加载（LCP 候选资源） -->
    <link rel="preload" as="image" href="/logo.svg" />
    <style>
      /* 首屏只保留 Vue 侧的 SplashScreen（光感过渡动画），此处不再渲染静态骨架屏。
         html 底色与应用浅色页底一致：避免滚动/回弹时从 body 边缘透出深色。 */
      html { background: #F5F6F8; }
      #app { min-height: 100vh; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <!-- 入口脚本：保留静态 src（Vite 构建依赖它识别入口）；
         旁路 error 捕获实现弱网重试，全部失败展示基础降级提示。 -->
    <script>
      (function () {
        var attempts = 0
        var MAX_RETRY = 2
        // 静态骨架屏已移除：首屏过渡只由 Vue 侧 SplashScreen 承担。
        // 这里只负责"加载失败"的降级提示，避免弱网时用户看到纯白页。
        function showNetworkFallback() {
          var app = document.getElementById('app')
          if (!app || app.children.length > 0) return
          app.innerHTML = '<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;' +
            'background:#F5F6F8;color:#64748b;font:14px/1.6 system-ui,-apple-system,sans-serif;text-align:center;padding:0 24px">' +
            '<p>网络异常，资源加载失败。<br/>请检查网络后 ' +
            '<a href="javascript:location.reload()" style="color:#1E6EB8">点击重试</a></p></div>'
        }
        var entrySrc = '' // 入口实际 src（构建后为 /assets/index-[hash].js），重试时惰性读取
        function resolveEntrySrc() {
          if (entrySrc) return entrySrc
          var el = document.getElementById('ll-entry') || document.querySelector('script[type="module"][src]')
          entrySrc = el ? (el.getAttribute('src') || '') : ''
          return entrySrc
        }
        function retryEntry() {
          if (attempts++ >= MAX_RETRY) {
            showNetworkFallback()
            return
          }
          var base = resolveEntrySrc() || '/src/main.js'
          var s = document.createElement('script')
          s.type = 'module'
          s.src = base + (base.includes('?') ? '&' : '?') + 'retry=' + attempts
          s.onerror = function () { setTimeout(retryEntry, 800 * attempts) }
          document.head.appendChild(s)
        }
        // 捕获入口脚本网络错误（bubble 阶段拿不到，用 window 捕获阶段）。
        // Vite 构建重写入口标签会丢 id，改按 src 特征匹配：
        // dev=/src/main.js，构建产物=/assets/index-[hash].js，排除带 retry 参数的重试脚本。
        window.addEventListener('error', function (e) {
          var t = e.target
          if (t && t.tagName === 'SCRIPT' && !/retry=/.test(t.src || '') &&
              (/\/assets\/index-/.test(t.src || '') || /\/src\/main\.js/.test(t.src || ''))) {
            if (!entrySrc) entrySrc = t.getAttribute('src') || ''
            retryEntry()
          }
        }, true)
        // 6s 兜底：仍未挂载才提示降级（挂载可能因语言自动识别合法推迟，过早提示会误伤）
        setTimeout(showNetworkFallback, 6000)
      })()
    </script>
    <script type="module" id="ll-entry" src="/src/main.js"></script>
  </body>
</html>
