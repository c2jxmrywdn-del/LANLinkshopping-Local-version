# ============================================================
# 微服务基础设施：Nacos（注册中心 + 配置中心）
#   用法：docker compose -f docker-compose.cloud.yml up -d
#   控制台：http://127.0.0.1:8848/nacos  （默认 nacos/nacos）
# ============================================================
services:
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: lanlink-nacos
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 512m
    ports:
      - "8848:8848"    # 主端口（服务注册/配置/控制台）
      - "9848:9848"    # gRPC 端口（Nacos 2.x 客户端必需，= 主端口+1000）
    restart: unless-stopped
