# SQLBot 智能问数（dataease/SQLBot，LLM + RAG Text-to-SQL）
#
# 由 docker run 迁移为 compose 管理：镜像、数据挂载与原容器一致（数据零丢失），
# 端口收敛到 127.0.0.1，并加入 shopping_default 网络，可用服务名直连
# mysql（shopping-mysql-1）与 lanlink-ai-gateway。
#
# 启动（仓库根目录）：
#   docker compose -f docker-compose.sqlbot.yml up -d
# 访问：
#   宿主机默认不映射 8000/8001。后端与网关都走 shopping_default 的 `sqlbot:8000`，
#   不需要宿主端口；确需临时打开 UI 时，用 `docker compose ... run` 或临时加
#   `ports` 后立即移除，避免把 SQLBot 管理端暴露给本机其它进程/LAN。
#   登录账号见根 .env 的 SQLBOT_USERNAME / SQLBOT_PASSWORD（真实值不入库/仓库）。
#   sqlbot-patches 将超管判定放宽为 id==1；首次部署必须改掉镜像默认密码，
#   走 `/api/v1/login/change-pwd`，密码会写入 SQLBot 的 PostgreSQL 并跨重启持久化。
# 停止：
#   docker compose -f docker-compose.sqlbot.yml down
#
# LLM 接入本地网关（OpenAI 兼容）：
#   api_domain = http://lanlink-ai-gateway:8090/v1
#   base_model = qwen2.5-7b
#   模型高级参数需加 extra_body = {"use_kb": false}，
#   否则网关默认 RAG 模板会重写 prompt，污染 Text-to-SQL。
# 数据源：mysql:3306 / lanlink_shopping（专用只读账号，仅 SELECT 业务表）。
#
# 本地补丁（sqlbot-patches/，只读挂载）：SQLBot 原版把超管硬编码为
# id==1 且 account=='admin'，导致管理员账号无法改为平台运营账号。
# 补丁将判定放宽为仅 id==1（涉及 system/crud/user.py 与 mcp/mcp.py 两处）。
# 升级镜像后需重新提取原文件并复核补丁是否仍适用。
#
# 独立 compose 项目名：与根项目（shopping）隔离，避免 --remove-orphans 误删。
name: shopping-sqlbot

services:
  sqlbot:
    image: dataease/sqlbot:latest
    container_name: sqlbot
    privileged: true
    # 不映射宿主端口：UI/API 与自带 MCP 都只在 shopping_default 内网可达。
    # 网关使用 http://sqlbot:8000；需要排障时用 `docker exec` 进入容器访问
    # 127.0.0.1:8000/8001，避免默认暴露管理端。
    volumes:
      # 与原 docker run 完全一致的 WSL 数据目录（内置 PostgreSQL 数据也在其中）
      - /root/data/sqlbot/excel:/opt/sqlbot/data/excel
      - /root/data/sqlbot/file:/opt/sqlbot/data/file
      - /root/data/sqlbot/images:/opt/sqlbot/images
      - /root/data/sqlbot/logs:/opt/sqlbot/app/logs
      - /root/data/postgresql:/var/lib/postgresql/data
      # 超管判定补丁（见文件头说明），只读挂载，容器不会回写
      - ./sqlbot-patches/user.py:/opt/sqlbot/app/apps/system/crud/user.py:ro
      - ./sqlbot-patches/mcp.py:/opt/sqlbot/app/apps/mcp/mcp.py:ro
    networks:
      - shopping_default
    restart: unless-stopped

networks:
  shopping_default:
    external: true
