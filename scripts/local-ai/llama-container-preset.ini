[*]
jinja = 1
log-colors = off
cache-type-k = q8_0
cache-type-v = q8_0
flash-attn = on
n-gpu-layers = 99

# ===== 投机解码（speculative decoding）=====
# 用小模型先"猜"几个 token，再由 7B 一次性并行验证，猜对的直接采纳。
# 收益：输出阶段吞吐提升（实测同类配置约 1.3-1.8x），代价是显存 + 少量算力。
#
# 为什么草稿模型必须在这里配、而不是让 Ollama 加载 0.5B：
#   投机解码要求「草稿模型与目标模型在**同一个推理进程**内共享 tokenizer 与
#   KV 前缀」。llama.cpp 的 draft 是进程内的一对模型；Ollama 是独立进程、
#   独立端口（11434），它加载的模型只会占显存，无法参与本进程的解码。
#   换句话说：Ollama 加载 0.5B 对 7B 的生成速度**零帮助**，还会挤掉 bge-m3
#   嵌入模型（OLLAMA_MAX_LOADED_MODELS=1），导致 embedding 回退 256 维。
#
# 显存预算：0.5B Q4_K_M 权重 469MB + 草稿 KV（q8_0）约 100-200MB
# ≈ 600MB。当前 7B 占 6.6GB / 8.0GB，余量 1.1GB，可以容纳但需留神。
# 若出现 OOM，先把 spec-draft-ngl 调低（只把草稿模型部分层放 GPU）。
# 【已关闭】实测无收益，见 docs/architecture-audit/_parts/speculative-decoding.md
# 7B 在此卡上已 48 tok/s（memory-bandwidth-bound），草稿模型省下的验证算力
# 被它自己的权重读取开销吃掉，加速比 1.006 落在噪声内。
# 保留下面几行参数不生效；将来换 14B/32B 时把本行取消注释即可重新启用。
# spec-draft-model = /models/Qwen2.5-0.5B-Instruct-Q4_K_M.gguf
# 每轮最多猜 4 个 token。
#
# **实测记录（2026-11-16，RTX 4070 Laptop 8GB）**：
#   - n-max=6：48.5 tok/s
#   - 关闭草稿：48.2 tok/s
#   → 加速比 1.006，在噪声范围内，**没有实质收益**。
#
# 原因判断：7B Q4_K_M 在这张卡上已经跑到 48 tok/s（约 21ms/token），
# 处于 memory-bandwidth-bound 状态；草稿模型的 forward 本身也要读权重，
# 省下的验证时间被草稿开销吃掉。投机解码的收益通常在「大模型 + 低带宽」
# 场景更明显（如 70B 跑在消费级卡上），7B 这个量级不划算。
#
# 保留 n-max=4 而不是删掉整段：如果后续换成更大的模型（14B/32B），
# 这套配置可以直接复用，只需把 spec-draft-model 换成对应的小模型。
# 若要彻底关闭，注释掉下面 spec-draft-model 一行即可（保留其余参数无害）。
spec-draft-n-max = 4
# 草稿 KV 也用 q8_0，省显存；草稿模型对精度不敏感（猜错会被 7B 否决）
spec-draft-type-k = q8_0
spec-draft-type-v = q8_0
# 草稿模型全部放 GPU（0.5B 很小，放 CPU 反而拖慢验证）
spec-draft-ngl = 99
# 草稿模型线程数：与主模型一致，避免线程争抢
spec-draft-threads = 8
# 注意：不要加 cache-reuse——实测（b11913）在两阶段 thinking 的"同块平移"请求下，
# KV 前缀复用拼接会产生损坏 KV 并在 slot 内自持续污染（客服 AI 重复字/乱码实锤根因）。
# 单请求 TTFT 收益远小于正确性代价。
# Single 8GB GPU: parallel=2 enables continuous batching for 2 concurrent /kb/ask.
# ctx-size is the TOTAL across slots: 32768 total -> 16384 per request (restores
# the pre-parallel single-request ceiling and covers SESSION_TOKEN_BUDGET=12000).
# q8_0 KV @32768 ~950MB -> VRAM ~6.6GB of 8188, ~1.5GB headroom.
parallel = 2
# i7-14650HX: give llama-server 8 performance-core threads; leave rest to Ollama/Java.
threads = 8
threads-batch = 8
ubatch-size = 1024

# Text model: long-context policy is text-only (never route long text to VL).
# YaRN factor 2 from the 16384 training context extrapolates to 32768.
[qwen2.5-7b]
model = /models/Qwen2.5-7B-Instruct-Q4_K_M.gguf
ctx-size = 32768
rope-scaling = yarn
rope-scale = 2
yarn-orig-ctx = 16384

# CPU-assist fallback for slight VRAM overflow: spill only 3 of 29 layers to CPU
# (26/29 layers stay on GPU -> speed stays close to full GPU; not for normal use).
[qwen2.5-7b-cpu-assist]
model = /models/Qwen2.5-7B-Instruct-Q4_K_M.gguf
ctx-size = 32768
n-gpu-layers = 26
rope-scaling = yarn
rope-scale = 2
yarn-orig-ctx = 16384

[qwen2.5-vl]
model = /models/Qwen2.5-VL-7B-Instruct-Q4_K_M.gguf
mmproj = /models/mmproj-F16.gguf
# Vision encoder must stay on GPU (CPU mmproj caused wrong answers and 24.7s latency).
# Gateway serializes VL calls anyway (models-max 1): parallel=1 keeps the full
# 6144 ctx for a single vision request instead of splitting it 3072/3072.
ctx-size = 6144
image-min-tokens = 1024
parallel = 1
