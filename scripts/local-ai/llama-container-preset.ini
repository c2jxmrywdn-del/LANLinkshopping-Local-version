[*]
jinja = 1
log-colors = off
cache-type-k = q8_0
cache-type-v = q8_0
flash-attn = on
n-gpu-layers = 99
# 注意：不要加 cache-reuse——实测（b11913）在两阶段 thinking 的"同块平移"请求下，
# KV 前缀复用拼接会产生损坏 KV 并在 slot 内自持续污染（客服 AI 重复字/乱码实锤根因）。
# 单请求 TTFT 收益远小于正确性代价。
# Single 8GB GPU: parallel=2 enables continuous batching for 2 concurrent /kb/ask.
# ctx-size is the TOTAL across slots: 32768 total -> 16384 per request (restores
# the pre-parallel single-request ceiling and covers SESSION_TOKEN_BUDGET=12000).
# q8_0 KV @32768 ~950MB -> VRAM ~6.6GB of 8188, ~1.5GB headroom.
parallel = 2
# i7-14650HX: give llama-server 8 performance-core threads; leave rest to Ollama/Java.
threads = 8
threads-batch = 8
ubatch-size = 1024

# Text model: long-context policy is text-only (never route long text to VL).
# YaRN factor 2 from the 16384 training context extrapolates to 32768.
[qwen2.5-7b]
model = /models/Qwen2.5-7B-Instruct-Q4_K_M.gguf
ctx-size = 32768
rope-scaling = yarn
rope-scale = 2
yarn-orig-ctx = 16384

# CPU-assist fallback for slight VRAM overflow: spill only 3 of 29 layers to CPU
# (26/29 layers stay on GPU -> speed stays close to full GPU; not for normal use).
[qwen2.5-7b-cpu-assist]
model = /models/Qwen2.5-7B-Instruct-Q4_K_M.gguf
ctx-size = 32768
n-gpu-layers = 26
rope-scaling = yarn
rope-scale = 2
yarn-orig-ctx = 16384

[qwen2.5-vl]
model = /models/Qwen2.5-VL-7B-Instruct-Q4_K_M.gguf
mmproj = /models/mmproj-F16.gguf
# Vision encoder must stay on GPU (CPU mmproj caused wrong answers and 24.7s latency).
# Gateway serializes VL calls anyway (models-max 1): parallel=1 keeps the full
# 6144 ctx for a single vision request instead of splitting it 3072/3072.
ctx-size = 6144
image-min-tokens = 1024
parallel = 1
